# Starter CircleCI config for pgx (single Go module).
# Tests require PostgreSQL via PGX_TEST_DATABASE (service container below).
version: 2.1

jobs:
  go:
    docker:
      - image: cimg/go:1.27
      - image: cimg/postgres:18.6
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgx_test
    environment:
      PGX_TEST_DATABASE: "host=127.0.0.1 user=postgres password=postgres dbname=pgx_test sslmode=disable"
    steps:
      - checkout
      - restore_cache:
          name: Restore Go module cache
          keys:
            - go-mod-v1-{{ checksum "go.sum" }}
      - run:
          name: Install dependencies
          command: |
            go mod download
            curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.13.2
      - save_cache:
          name: Save Go module cache
          key: go-mod-v1-{{ checksum "go.sum" }}
          paths:
            - /home/circleci/go/pkg/mod
      - run:
          name: Wait for PostgreSQL
          command: dockerize -wait tcp://127.0.0.1:5432 -timeout 1m
      - run:
          name: Setup test database
          command: |
            cat > ./_ci_setup_db.go \<<'EOF'
            //go:build ignore

            package main

            import (
            	"context"
            	"fmt"
            	"os"

            	"github.com/jackc/pgx/v5"
            )

            func main() {
            	ctx := context.Background()
            	conn, err := pgx.Connect(ctx, os.Getenv("PGX_TEST_DATABASE"))
            	if err != nil {
            		panic(err)
            	}
            	defer conn.Close(ctx)

            	stmts := []string{
            		`create extension if not exists hstore`,
            		`create extension if not exists ltree`,
            		`do $$ begin create domain uint64 as numeric(20,0); exception when duplicate_object then null; end $$`,
            	}
            	for _, stmt := range stmts {
            		if _, err := conn.Exec(ctx, stmt); err != nil {
            			panic(fmt.Errorf("%s: %w", stmt, err))
            		}
            	}
            }
            EOF
            go run ./_ci_setup_db.go
            rm ./_ci_setup_db.go
      - run:
          name: Test
          command: go test -count=1 ./...
      - run:
          name: Lint
          command: golangci-lint run ./...

workflows:
  main:
    jobs:
      - go
