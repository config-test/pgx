version: 2.1

# Single Go module (github.com/jackc/pgx/v5). Runtime from mise.toml / prior CI: Go 1.27.
# Package manager: Go modules (go.sum).
# No separate library "build" step in repo scripts; compile happens via go test.
jobs:
  test:
    docker:
      - image: cimg/go:1.27
        environment:
          # Required by most integration tests (see CONTRIBUTING.md / prior GitHub Actions CI).
          PGX_TEST_DATABASE: "host=127.0.0.1 user=postgres dbname=pgx_test sslmode=disable"
      - image: cimg/postgres:18.6
        environment:
          POSTGRES_DB: pgx_test
          POSTGRES_HOST_AUTH_METHOD: trust
    steps:
      - checkout
      - restore_cache:
          name: Restore Go module cache
          keys:
            - go-mod-v1-{{ checksum "go.sum" }}
      - run:
          name: Download Go modules
          command: go mod download
      - save_cache:
          name: Save Go module cache
          key: go-mod-v1-{{ checksum "go.sum" }}
          paths:
            - /home/circleci/go/pkg/mod
      - run:
          name: Install golangci-lint
          command: |
            curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
              | sh -s -- -b "$(go env GOPATH)/bin" v2.13.2
      - run:
          name: Wait for Postgres and create extensions
          command: |
            mkdir -p /tmp/pgx-db-setup
            cat > /tmp/pgx-db-setup/main.go \<<'EOF'
            package main

            import (
            	"context"
            	"fmt"
            	"os"
            	"time"

            	"github.com/jackc/pgx/v5"
            )

            func main() {
            	dsn := os.Getenv("PGX_SETUP_DATABASE")
            	ctx := context.Background()
            	var conn *pgx.Conn
            	var err error
            	for i := 0; i < 60; i++ {
            		conn, err = pgx.Connect(ctx, dsn)
            		if err == nil {
            			break
            		}
            		fmt.Println("waiting for postgres:", err)
            		time.Sleep(time.Second)
            	}
            	if err != nil {
            		panic(err)
            	}
            	defer conn.Close(ctx)

            	stmts := []string{
            		`create extension if not exists hstore`,
            		`create extension if not exists ltree`,
            		`do $$ begin create domain uint64 as numeric(20,0); exception when duplicate_object then null; end $$`,
            	}
            	for _, s := range stmts {
            		if _, err := conn.Exec(ctx, s); err != nil {
            			panic(fmt.Errorf("%s: %w", s, err))
            		}
            	}
            	fmt.Println("database ready")
            }
            EOF
            cat > /tmp/pgx-db-setup/go.mod \<<EOF
            module pgxdbsetup

            go 1.25

            replace github.com/jackc/pgx/v5 => $${PWD}
            EOF
            cd /tmp/pgx-db-setup
            go mod tidy
            PGX_SETUP_DATABASE="host=127.0.0.1 user=postgres dbname=pgx_test sslmode=disable" go run .
      - run:
          name: Test
          command: go test ./...
      - run:
          name: Lint
          command: golangci-lint run ./...

workflows:
  main:
    jobs:
      - test
