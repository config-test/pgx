version: 2.1

# Starter pipeline for pgx (single Go module, github.com/jackc/pgx/v5).
#
# The test suite is an integration suite: nearly every test connects to a real PostgreSQL server
# via PGX_TEST_DATABASE and fails (rather than skips) without one, so a PostgreSQL service
# container is part of the job. Tests gated on the other PGX_TEST_* variables (TLS, SCRAM, MD5,
# unix socket, PgBouncer, OAuth) skip here.
#
# Deliberately left out for now: the PostgreSQL 14-18 / CockroachDB / Go version matrix, Windows,
# and the PgBouncer job that the old GitHub Actions workflow carried.

jobs:
  test:
    docker:
      # go.mod requires Go 1.25; mise.toml pins 1.27.0 and the previous CI matrix included 1.27.
      - image: cimg/go:1.27
      - image: cimg/postgres:18.6
        environment:
          POSTGRES_USER: postgres
          POSTGRES_DB: pgx_test
          # cimg/postgres defaults to trust auth; no password or secret needed.
          POSTGRES_HOST_AUTH_METHOD: trust
    environment:
      PGX_TEST_DATABASE: "host=127.0.0.1 user=postgres dbname=pgx_test sslmode=disable"
    steps:
      - checkout

      - restore_cache:
          keys:
            - go-mod-v1-{{ checksum "go.sum" }}

      - run:
          name: Download modules
          command: go mod download

      - save_cache:
          key: go-mod-v1-{{ checksum "go.sum" }}
          paths:
            - /home/circleci/go/pkg/mod

      - run:
          name: Build
          command: go build ./...

      - run:
          name: Wait for PostgreSQL
          # dockerize ships in cimg/base, which cimg/go is built on.
          command: dockerize -wait tcp://127.0.0.1:5432 -timeout 2m

      - run:
          name: Initialize test database
          # Extensions, the uint64 domain, and the auth/test roles the suite expects.
          # psql comes from the postgresql-client package in cimg/base.
          command: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d pgx_test -f testsetup/postgresql_setup.sql

      - run:
          name: Test
          command: go test -race ./...

      - run:
          name: Check formatting
          # Same check the previous CI ran: gofmt -s must leave the tree unchanged.
          command: |
            gofmt -l -s -w .
            git diff --exit-code

      - run:
          name: Vet
          command: go vet ./...

workflows:
  ci:
    jobs:
      - test
